<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concept Lab — Lecture 19 practice tool</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d1b18;--mut:#6b665d;--paper:#FBF8F1;--rule:#E4DDCF;--card:#fff;--soft:#F3EEE3;--acc:#D9480F;
 --morph:#3B5BDB;--cbox:#C98A10;--wt:#2F9E44;--datum:#0F8B8D;--pair:#9C36B5;--score:#D9480F;--fun:#1d1b18;
 --pos:#E3F4E6;--neg:#FBE4E1;--posT:#1F7A35;--negT:#B42318;--c:var(--acc)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--paper);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:268px 1fr;min-height:100vh}
aside{background:#1d1b18;color:#EDE6D8;padding:22px 16px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:6px}
.brand{font-family:Fraunces;font-size:25px;font-weight:600;color:#fff;padding:0 8px 2px}
.brand em{color:#FFB37A;font-style:italic;font-weight:500}
.brandsub{font-size:12px;color:#A9A193;padding:0 8px 16px;letter-spacing:.04em}
.navgrp{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#8d8577;padding:12px 10px 4px;font-weight:700}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer;border:0;background:transparent;text-align:left;width:100%;color:#E6DECF;font-weight:500}
.nav:hover{background:#2b2924}
.nav.on{background:#FBF8F1;color:#1d1b18;font-weight:700}
.nav i{width:24px;height:24px;border-radius:7px;flex:none;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;font-weight:700;color:#fff;background:var(--c)}
.nav .badge{margin-left:auto;font-size:11px;font-family:"JetBrains Mono",monospace;opacity:.7}
.aside-foot{margin-top:auto;padding:14px 8px 0;border-top:1px solid #34312b;font-size:12px;color:#A9A193}
.aside-foot input{width:100%;background:#2b2924;border:1px solid #403c35;border-radius:8px;padding:8px 10px;color:#fff;margin-top:6px}
main{min-width:0}
.top{display:flex;align-items:center;gap:10px;padding:14px 30px;border-bottom:1px solid var(--rule);background:rgba(251,248,241,.94);position:sticky;top:0;z-index:20;backdrop-filter:blur(6px);flex-wrap:wrap}
.top .proj{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;min-width:0}
.top .proj input{border:1px solid transparent;background:transparent;border-radius:8px;padding:5px 8px;font-weight:700;min-width:140px;max-width:340px}
.top .proj input:hover,.top .proj input:focus{border-color:var(--rule);background:#fff;outline:none}
.sp{flex:1}
.btn{border:1px solid var(--rule);background:#fff;color:var(--ink);border-radius:9px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{border-color:#cfc5b2;background:#FFFDF8}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.pri:hover{background:#000}
.btn.acc{background:var(--c);border-color:var(--c);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:7px}
.btn.xs{padding:2px 7px;font-size:11.5px;border-radius:6px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.wrap{padding:26px 30px 80px;max-width:1380px}
.mhead{display:flex;align-items:flex-end;gap:18px;margin-bottom:16px;flex-wrap:wrap}
.mhead h1{font-family:Fraunces;font-weight:600;font-size:36px;line-height:1.05;margin:0;letter-spacing:-.01em}
.mhead h1 em{color:var(--c);font-style:italic;font-weight:500}
.mhead .kick{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--c);font-weight:700;margin-bottom:6px}
.mhead .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.how{background:#fff;border:1px solid var(--rule);border-left:4px solid var(--c);border-radius:0 12px 12px 0;padding:12px 16px;margin-bottom:18px}
.how summary{cursor:pointer;font-weight:700;list-style:none;display:flex;align-items:center;gap:8px}
.how summary::-webkit-details-marker{display:none}
.how summary::before{content:"▸";color:var(--c);transition:transform .15s}
.how[open] summary::before{transform:rotate(90deg)}
.how ol{margin:10px 0 2px;padding-left:22px}
.how li{margin-bottom:4px}
.how .tip{margin-top:8px;color:var(--mut);font-size:13.5px}
.card{background:#fff;border:1px solid var(--rule);border-radius:14px;padding:16px 18px}
.card h3,.sect{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--c);margin:0 0 10px;font-weight:700}
.grid{display:grid;gap:16px}
.grid>*{min-width:0}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g21{grid-template-columns:2fr 1fr}.g12{grid-template-columns:1fr 2fr}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.mut{color:var(--mut)}
.small{font-size:13px}
.mono{font-family:"JetBrains Mono",monospace}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--mut)}
.inp{border:1px solid var(--rule);background:#fff;border-radius:8px;padding:7px 10px;min-width:0}
.inp:focus{outline:2px solid color-mix(in srgb,var(--c) 35%,transparent);border-color:var(--c)}
.inp.n{width:74px;text-align:right;font-family:"JetBrains Mono",monospace;font-size:14px}
.inp.big{font-size:17px;font-weight:600;width:100%}
.tblwrap{overflow:auto;border:1px solid var(--rule);border-radius:12px;background:#fff}
table.t{border-collapse:separate;border-spacing:0;width:100%;font-size:14px}
table.t th,table.t td{border-bottom:1px solid #EEE8DC;border-right:1px solid #EEE8DC;padding:6px 8px;text-align:center;vertical-align:middle}
table.t tr>*:last-child{border-right:0}
table.t tbody tr:last-child>*{border-bottom:0}
table.t thead th{background:var(--soft);font-weight:700;font-size:13px;position:sticky;top:0;z-index:1}
table.t thead th .s{display:block;font-weight:500;color:var(--mut);font-size:11.5px}
table.t td.l,table.t th.l{text-align:left}
table.t td.crit{text-align:left;font-weight:600;background:#FBF8F1;min-width:150px}
table.t tr.sum td{background:#FFFBEA}
table.t tr.sum.first td{border-top:2px solid #E8DFC8}
table.t tr.net td{background:#FFF3C9;font-weight:700}
td.pos{background:var(--pos)!important;color:var(--posT);font-weight:700}
td.neg{background:var(--neg)!important;color:var(--negT);font-weight:700}
td.datum,th.datum{background:#EEF7F7!important;color:var(--datum)}
td.diag{background:var(--soft);color:#b0a99c}
td.mirror{color:#9a9488;background:#FCFAF6}
td.tot,th.tot{background:#FFF3C9!important;font-weight:700}
select.cell{appearance:none;-webkit-appearance:none;border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 6px;text-align:center;text-align-last:center;font-weight:700;cursor:pointer;min-width:48px;font-family:"JetBrains Mono",monospace;font-size:14px}
select.cell:hover{border-color:#d9cfbc;background:#fff}
select.cell:focus{outline:2px solid var(--c)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 10px 3px 4px;font-size:12.5px;font-weight:600;background:#fff;border:1px solid var(--rule);cursor:pointer;white-space:nowrap}
.chip b{color:#fff;border-radius:99px;padding:1px 7px;font-family:"JetBrains Mono",monospace;font-size:11px}
.chip.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}
.chip.off{opacity:.45}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--mut)}
.pill.ok{background:var(--pos);color:var(--posT)}.pill.bad{background:var(--neg);color:var(--negT)}.pill.warn{background:#FFF1D6;color:#9a6700}
.note{border-radius:12px;padding:12px 14px;font-size:14px}
.note.ok{background:#EEF6EF;border:1px solid #CFE6D3}.note.bad{background:#FDF0EE;border:1px solid #F4CFC9}.note.warn{background:#FFF7E6;border:1px solid #F3DDB0}.note.info{background:#fff;border:1px solid var(--rule)}
.formula{font-family:"JetBrains Mono",monospace;background:#1d1b18;color:#FBF8F1;border-radius:10px;padding:10px 14px;display:inline-block;font-size:15px}
.formula b{color:#FFC78A}
.bignum{font-family:Fraunces;font-size:44px;font-weight:600;line-height:1;color:var(--c)}
/* morph */
.morph td.sf{min-width:210px;background:#FBF8F1;text-align:left}
.morph td.idea{min-width:150px;text-align:left;vertical-align:top;position:relative}
.morph td.idea .ib{display:flex;flex-direction:column;gap:4px}
.morph td.idea textarea{border:1px solid transparent;border-radius:6px;resize:none;padding:4px 6px;width:100%;min-height:38px;background:transparent;font-size:13.5px;line-height:1.3}
.morph td.idea textarea:hover{border-color:var(--rule);background:#FFFDF8}
.morph td.idea textarea:focus{border-color:var(--morph);background:#fff;outline:none}
.morph td.idea.out textarea,.morph td.idea.out .itxt{text-decoration:line-through;color:#a59f94}
.morph td.idea .tools{display:flex;gap:4px;opacity:0;transition:opacity .1s}
.morph td.idea:hover .tools,.morph td.idea:focus-within .tools{opacity:1}
.morph td.build{cursor:pointer;transition:background .1s}
.morph td.build:hover{background:#EDF2FF}
.morph td.build.picked{background:#E7EDFF;box-shadow:inset 0 0 0 2px var(--morph)}
.morph td.build.out{cursor:not-allowed;background:repeating-linear-gradient(45deg,#fff,#fff 6px,#F6F2EA 6px,#F6F2EA 12px)}
.itxt{font-size:13.5px;line-height:1.3;display:block;padding:2px 2px 4px}
.dots{display:flex;gap:3px;flex-wrap:wrap}
.dot{font-size:10.5px;font-weight:700;color:#fff;border-radius:99px;padding:0 6px;font-family:"JetBrains Mono",monospace;line-height:17px}
.morphbox{position:relative}
#pathsvg{position:absolute;inset:0;pointer-events:none;z-index:2}
.seg{display:inline-flex;background:var(--soft);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;font-weight:600;cursor:pointer;font-size:13px;color:var(--mut)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.clist{display:flex;flex-direction:column;gap:8px}
.citem{display:grid;grid-template-columns:auto 70px 1fr auto;gap:8px;align-items:center;border:1px solid var(--rule);border-radius:10px;padding:6px 8px;background:#fff}
.citem.act{border-color:var(--morph);box-shadow:0 0 0 2px #DBE4FF}
.swatch{width:14px;height:14px;border-radius:50%}
/* cbox */
.cboxwrap{position:relative;user-select:none;touch-action:none}
.cboxwrap svg{width:100%;height:auto;display:block}
.cboxwrap .q{cursor:pointer}
.cboxwrap .pt{cursor:grab}
.cboxwrap .pt:active{cursor:grabbing}
/* home */
.hero{background:#1d1b18;color:#FBF8F1;border-radius:20px;padding:30px 34px;display:grid;grid-template-columns:1.3fr 1fr;gap:26px;align-items:center}
.hero h1{font-family:Fraunces;font-size:44px;line-height:1.02;margin:0 0 12px;font-weight:600}
.hero h1 em{color:#FFB37A;font-weight:500}
.hero p{color:#D8D0C1;margin:0 0 10px;font-size:16px}
.excards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.ex{background:#fff;border:1px solid var(--rule);border-radius:14px;padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:transform .12s,box-shadow .12s;text-align:left}
.ex:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(60,40,10,.08)}
.ex h4{margin:0;font-family:Fraunces;font-size:20px;font-weight:600}
.ex .tg{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--acc)}
.ex .mt{display:flex;gap:5px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.ex .mt span{font-size:11px;background:var(--soft);border-radius:99px;padding:2px 8px;color:var(--mut);font-weight:600}
.ex.cur{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}
.mcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.mc{border:1px solid var(--rule);background:#fff;border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;border-top:4px solid var(--c)}
.mc b{display:block;margin-bottom:3px}
.mc span{font-size:13px;color:var(--mut)}
/* modal & toast */
.modal{position:fixed;inset:0;background:rgba(29,27,24,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal .box{background:#fff;border-radius:16px;padding:22px;max-width:480px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal h3{margin:0 0 8px;font-family:Fraunces;font-size:22px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1d1b18;color:#fff;padding:10px 16px;border-radius:10px;z-index:200;font-weight:600;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:90vw}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c)}
.spark{display:flex;gap:2px;align-items:flex-end;height:30px}
.spark i{width:9px;background:var(--c);border-radius:2px 2px 0 0;opacity:.85}
.hidden{display:none!important}
.mobnav{display:none}
@media (max-width:980px){
 .app{grid-template-columns:1fr}
 aside{display:none}
 .mobnav{display:flex;gap:6px;overflow:auto;padding:10px 14px;background:#1d1b18;position:sticky;top:0;z-index:30}
 .mobnav button{flex:none;border:0;border-radius:99px;padding:7px 12px;background:#2b2924;color:#EDE6D8;font-weight:600;font-size:13px}
 .mobnav button.on{background:#FBF8F1;color:#1d1b18}
 .top{top:52px;padding:10px 14px}
 .wrap{padding:18px 14px 70px}
 .g2,.g3,.g21,.g12,.hero{grid-template-columns:1fr}
 .mhead h1{font-size:28px}
}
/* ---------- touch & mobile layer ---------- */
.segc{display:inline-flex;gap:4px;flex-wrap:wrap}
.segc button{min-width:42px;min-height:40px;border:1px solid var(--rule);background:#fff;border-radius:9px;font-family:"JetBrains Mono",monospace;font-weight:700;font-size:15px;cursor:pointer;padding:0 8px}
.segc button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.segc button.on.p{background:var(--posT);border-color:var(--posT)}
.segc button.on.m{background:var(--negT);border-color:var(--negT)}
.segc button.on.z{background:#6b665d;border-color:#6b665d}
.mlist{display:flex;flex-direction:column;gap:10px}
.mrow{background:#fff;border:1px solid var(--rule);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.mrow .h{display:flex;justify-content:space-between;gap:8px;align-items:baseline;font-weight:600}
.mrow .h .w{font-family:"JetBrains Mono",monospace;font-size:12.5px;color:var(--mut);font-weight:500}
.cpick{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.cpick .chip{padding:7px 12px 7px 6px;font-size:13.5px}
.stick{position:sticky;top:0;z-index:5;background:var(--paper);padding:8px 0 4px}
.sumgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.sumcell{background:#fff;border:1px solid var(--rule);border-radius:10px;padding:8px 10px}
.sumcell .k{font-size:11px;color:var(--mut);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.sumcell .v{font-family:Fraunces;font-size:24px;font-weight:600}
.nextbar{display:flex;justify-content:space-between;gap:10px;margin-top:26px;flex-wrap:wrap}
.menu{position:absolute;right:14px;top:52px;background:#fff;border:1px solid var(--rule);border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.15);padding:6px;display:flex;flex-direction:column;z-index:60;min-width:200px}
.menu button,.menu label{border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:8px;font-weight:600;cursor:pointer;font-size:14.5px}
.menu button:hover,.menu label:hover{background:var(--soft)}
.morph-cards{display:flex;flex-direction:column;gap:12px}
.mcard{background:#fff;border:1px solid var(--rule);border-radius:14px;padding:12px}
.mcard .sfn{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.mcard .ideas{display:flex;flex-direction:column;gap:6px}
.mcard .idea{display:flex;gap:8px;align-items:center;border:1px solid #EEE8DC;border-radius:10px;padding:8px 10px;min-height:46px}
.mcard .idea.picked{background:#E7EDFF;border-color:var(--morph);box-shadow:inset 0 0 0 1px var(--morph)}
.mcard .idea.out .itxt,.mcard .idea.out input{text-decoration:line-through;color:#a59f94}
.mcard .idea input{flex:1;border:0;background:transparent;font-size:15px;min-width:0;padding:4px 0}
.mcard .idea input:focus{outline:none}
.mcard .idea .itxt{flex:1}
.ib-x{border:0;background:var(--soft);border-radius:8px;min-width:36px;min-height:36px;cursor:pointer;font-weight:700;color:var(--mut)}
@media (max-width:980px){
  .topacts{display:none!important}
  .top{flex-wrap:nowrap}
  .top .sp{display:none}
  .top .proj{flex:1;min-width:0}
  .top .proj input{min-width:0;width:100%}
  .moremenu{display:inline-flex!important}
}
@media (min-width:981px){ .moremenu{display:none!important} }
@media (max-width:760px){
  body{font-size:15.5px}
  .mhead{margin-bottom:12px}
  .mhead .acts{margin-left:0;width:100%}
  .mhead .acts .btn{flex:1;justify-content:center;min-height:42px}
  .btn{min-height:38px}
  .btn.sm{min-height:36px}
  .btn.xs{min-height:30px;padding:4px 9px}
  .inp{padding:10px 12px;font-size:16px}
  .inp.n{width:84px;font-size:16px}
  select.inp{font-size:16px}
  .card{padding:14px}
  .hero{padding:22px 20px}
  .hero h1{font-size:32px}
  .how{padding:10px 12px}
  table.t{font-size:13px}
  table.t td.crit{min-width:120px;position:sticky;left:0;z-index:1}
  table.t thead th:first-child{position:sticky;left:0;z-index:2}
  .citem{grid-template-columns:auto 58px 1fr auto}
  .toast{bottom:16px;width:max-content}
  .nextbar .btn{flex:1;justify-content:center;min-height:44px}
}
@media (min-width:761px){.cpick{flex-wrap:wrap;overflow:visible}}

</style>
</head>
<body>
<div class="mobnav" id="mobnav"></div>
<div class="app">
  <aside id="aside"></aside>
  <main>
    <div class="top">
      <div class="proj"><span class="mut small">Project</span><input id="projname" data-fid="projname" aria-label="Project name"></div>
      <span class="sp"></span>
      <button class="btn sm" id="bLoadEx">Examples</button>
      <button class="btn sm" id="bSave">Save project</button>
      <label class="btn sm" style="cursor:pointer">Open project<input type="file" id="fOpen" accept=".json,application/json" class="hidden"></label>
      <button class="btn sm pri" id="bReport">Full report PDF</button>
    </div>
    <div class="wrap" id="view"></div>
  </main>
</div>
<div id="layer"></div>
<script>/* Shared example data — used by BOTH the teaching PDF and the practice tool.
   Ratings: screening uses numbers (-2..2) shown as --,-,0,+,++ ; pairwise stores row-vs-column for i<j. */
window.L19_EXAMPLES = [
{
  id: "bottle",
  group: "main",
  name: "Water Bottle (worked example)",
  tag: "Simple worked example — every method",
  blurb: "A water bottle for college. One simple product taken through every method, step by step.",
  overall: "Carry drinking water through the college day",
  subfunctions: [
    { name: "Hold water", ideas: [ { t: "Plastic body" }, { t: "Steel body" }, { t: "Glass body", x: true } ] },
    { name: "Close the opening", ideas: [ { t: "Screw cap" }, { t: "Flip-top" }, { t: "Straw lid" } ] },
    { name: "Carry it", ideas: [ { t: "Loop handle" }, { t: "Shoulder strap" } ] }
  ],
  concepts: [

<script>/* Shared calculations — used by BOTH the teaching PDF and the practice tool. */
window.L19 = (function () {
  const round = (v, d = 2) => Math.round(v * Math.pow(10, d) + 1e-9) / Math.pow(10, d);
  const fmt = (v, d = 2) => {
    if (v === null || v === undefined || isNaN(v)) return "–";
    const r = round(v, d);
    return (Math.abs(r - Math.round(r)) < 1e-9 && d <= 2 ? r.toFixed(d === 0 ? 0 : 2) : r.toFixed(d)).replace(/\.?0+$/, m => (d && m.includes(".") ? (r % 1 === 0 ? "" : m) : m));
  };
  const f2 = v => (v === null || v === undefined || isNaN(v)) ? "–" : round(v, 2).toFixed(2);
  const sym = (v) => v === 0 ? "0" : v > 0 ? "+".repeat(v) : "−".repeat(-v);
  const signed = v => v > 0 ? "+" + v : v < 0 ? "−" + Math.abs(v) : "0";

  function conceptById(ex, id) { return (ex.concepts || []).find(c => c.id === id); }

  function counts(ex) {
    const sf = ex.subfunctions || [];
    if (!sf.length) return { theoretical: 0, practical: 0, factors: [], pfactors: [] };
    const factors = sf.map(s => s.ideas.length);
    const pfactors = sf.map(s => s.ideas.filter(i => !i.x).length);
    return {
      factors, pfactors,
      theoretical: factors.reduce((a, b) => a * b, 1),
      practical: pfactors.reduce((a, b) => a * b, 1)
    };
  }

  /* rank with ties (competition ranking: 1,2,2,4) ; higher is better */
  function rankOf(values) {
    return values.map(v => 1 + values.filter(o => o > v + 1e-9).length);
  }

  function screening(ex) {
    const s = ex.screening; if (!s) return null;
    const n = ex.criteria.length;
    const rows = s.include.map(id => {
      const r = (s.r[id] || []).slice(0, n);
      while (r.length < n) r.push(null);
      let plus = 0, minus = 0, same = 0, plusCount = 0, minusCount = 0;
      r.forEach(v => {
        if (v === null || v === undefined) return;
        if (v > 0) { plus += v; plusCount++; } else if (v < 0) { minus += -v; minusCount++; } else same++;
      });
      return { id, r, plus, minus, same, plusCount, minusCount, net: plus - minus };
    });
    const ranks = rankOf(rows.map(x => x.net));
    rows.forEach((x, i) => {
      x.autoRank = ranks[i];
      x.tie = ranks.filter(k => k === ranks[i]).length > 1;
      x.rank = (s.rankOverride && s.rankOverride[x.id]) || ranks[i];
    });
    return rows;
  }

  function pairwiseCrit(ex, critIdx) {
    const p = ex.pairwise; const t = (p.t && p.t[String(critIdx)]) || {};
    const ids = p.include;
    const get = (a, b) => {
      if (a === b) return null;
      if (t[a + "|" + b] !== undefined) return t[a + "|" + b];
      if (t[b + "|" + a] !== undefined) return -t[b + "|" + a];
      return undefined;
    };
    const m = ids.map(a => ids.map(b => get(a, b)));
    const sums = m.map(row => row.reduce((s, v) => s + (typeof v === "number" ? v : 0), 0));
    const complete = m.every((row, i) => row.every((v, j) => i === j || v !== undefined));
    return { ids, m, sums, complete };
  }

  function pairwise(ex) {
    const p = ex.pairwise; if (!p) return null;
    const crits = p.crit;
    const ws = p.weights || crits.map(() => 100 / crits.length);
    const wsum = ws.reduce((a, b) => a + b, 0) || 1;
    const per = crits.map(c => pairwiseCrit(ex, c));
    const totals = p.include.map((id, i) => per.reduce((s, pc, k) => s + pc.sums[i] * ws[k] / wsum, 0));
    return { per, totals, ranks: rankOf(totals), ws: ws.map(w => w / wsum) };
  }

  function scoring(ex, weightsOverride) {
    const s = ex.scoring; if (!s) return null;
    const w = (weightsOverride || ex.criteria.map(c => c.w)).map(Number);
    const wsum = w.reduce((a, b) => a + b, 0) || 1;
    const wf = w.map(x => x / wsum);
    const rows = s.include.map(id => {
      const r = (s.r[id] || []).slice(0, ex.criteria.length);
      while (r.length < ex.criteria.length) r.push(null);
      const ws = r.map((v, i) => (v === null || v === undefined || v === "") ? null : Number(v) * wf[i]);
      const total = ws.reduce((a, b) => a + (b || 0), 0);
      return { id, r, ws, total, filled: r.every(v => v !== null && v !== undefined && v !== "") };
    });
    const ranks = rankOf(rows.map(x => x.total));
    rows.forEach((x, i) => x.rank = ranks[i]);
    return { rows, wf, wsum };
  }

  /* Matrix (pairwise) method for criteria weights: count wins, add 1 so none is zero, normalise */
  function matrixWeights(n, matrix) {
    const wins = Array(n).fill(0);
    for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
      const v = matrix[i + "|" + j];
      if (v === 1) wins[i] += 1; else if (v === 0) wins[j] += 1; else if (v === 0.5) { wins[i] += .5; wins[j] += .5; }
    }
    const pts = wins.map(x => x + 1);
    const tot = pts.reduce((a, b) => a + b, 0);
    return { wins, pts, tot, w: pts.map(p => p / tot * 100) };
  }

  function treeWeights(tree) {
    return tree.local.map(l => (tree.groups[l.g] ? tree.groups[l.g].w : 0) * l.w / 100);
  }

  return { round, f2, sym, signed, fmt, conceptById, counts, rankOf, screening, pairwiseCrit, pairwise, scoring, matrixWeights, treeWeights };
})();

function removeConcept(id) {
  P.concepts = P.concepts.filter(c => c.id !== id);
  ["screening", "pairwise", "scoring"].forEach(k => { P[k].include = P[k].include.filter(x => x !== id); });
  if (P.screening.datum === id) P.screening.datum = (P.concepts[0] || {}).id || null;
  if (P.scoring.ref === id) P.scoring.ref = null;
  if (UI.active === id) UI.active = null;
}
function renameConcept(oldId, nid) {
  nid = cleanId(nid);
  if (!nid || nid === oldId) return false;
  if (cById(nid)) { toast("That code is already used"); return false; }
  const c = cById(oldId); c.id = nid;
  const ren = o => { if (o && o[oldId] !== undefined) { o[nid] = o[oldId]; delete o[oldId]; } };
  ["screening", "pairwise", "scoring"].forEach(k => { P[k].include = P[k].include.map(x => x === oldId ? nid : x); });
  ren(P.screening.r); ren(P.screening.cont); ren(P.scoring.r); ren(P.scoring.cont);
  if (P.screening.datum === oldId) P.screening.datum = nid;
  if (P.scoring.ref === oldId) P.scoring.ref = nid;
  Object.values(P.pairwise.t).forEach(t => Object.keys(t).forEach(k => { const [a, b] = k.split("|"); if (a === oldId || b === oldId) { t[(a === oldId ? nid : a) + "|" + (b === oldId ? nid : b)] = t[k]; delete t[k]; } }));
  if (UI.active === oldId) UI.active = nid;
  return true;
}
function removeCriterion(i) {
  P.criteria.splice(i, 1);
  Object.values(P.screening.r).forEach(a => Array.isArray(a) && a.splice(i, 1));
  Object.values(P.scoring.r).forEach(a => Array.isArray(a) && a.splice(i, 1));
  P.scoring.profiles.forEach(p => p.w.splice(i, 1));
  P.weighting.tree.local.splice(i, 1);
  const nm = {}; Object.entries(P.weighting.matrix).forEach(([k, v]) => { let [a, b] = k.split("|").map(Number); if (a === i || b === i) return; if (a > i) a--; if (b > i) b--; nm[a + "|" + b] = v; }); P.weighting.matrix = nm;
  const p = P.pairwise, keep = []; const nt = {};
  p.crit.forEach((c, k) => { if (c === i) return; keep.push([c > i ? c - 1 : c, p.weights[k]]); });
  Object.entries(p.t).forEach(([k, v]) => { const c = Number(k); if (c === i) return; nt[String(c > i ? c - 1 : c)] = v; });
  p.crit = keep.map(x => x[0]); p.weights = keep.map(x => x[1]); p.t = nt;
}
function setPair(a, b, v) {
  const p = P.pairwise, ci = p.crit[UI.pwCrit]; const t = p.t[String(ci)] = p.t[String(ci)] || {};

let DL = null, dlTried = false;
function getDL() {
  if (DL || dlTried) return Promise.resolve(DL);
  try {
    if (window.claude && typeof window.claude.use === "function") {
      return Promise.race([window.claude.use("downloads"), new Promise(r => setTimeout(() => r(null), 4000))]).then(d => { DL = d; dlTried = true; return d; }).catch(() => { dlTried = true; return null; });
    }
  } catch (e) {}
  dlTried = true; return Promise.resolve(null);
}
setTimeout(getDL, 300);
async function saveFile(name, blob) {
  const d = await getDL();
  if (d) {
    try { await d.save({ filename: name, data: blob }); toast("Saved " + name); return; }
    catch (e) { const c = e && e.code; if (c === "declined") { toast("Download cancelled"); return; } if (c === "rate_limited") { toast("Please wait a moment and try again"); return; } }
  }
  try {
    const url = URL.createObjectURL(blob); const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 2000); toast("Downloading " + name);
  } catch (e) { toast("Download is not available here"); }
}

const INK = "#1d1b18", MUT = "#6b665d", RULE = "#E4DDCF", SOFT = "#F3EEE3";

    this.y = 56; this.color = color || "#D9480F";

    x.font = `600 46px Fraunces, Georgia, serif`; x.fillStyle = INK; x.fillText(title, this.M, this.y); this.y += 34;

    this.y += 22; x.fillStyle = RULE; x.fillRect(this.M, this.y, this.W - 2 * this.M, 2); this.y += 30;
  }

  wrap(t, maxW) {
    const words = String(t == null ? "" : t).split(/\s+/); const lines = []; let cur = "";
    words.forEach(w => { const test = cur ? cur + " " + w : w; if (this.x.measureText(test).width > maxW && cur) { lines.push(cur); cur = w; } else cur = test; });
    lines.push(cur);
    return lines.flatMap(l => { if (this.x.measureText(l).width <= maxW) return [l]; let o = [], s = ""; for (const ch of l) { if (this.x.measureText(s + ch).width > maxW) { o.push(s); s = ch; } else s += ch; } o.push(s); return o; });
  }

    const lines = this.wrap(t, o.maxW || this.W - 2 * this.M);

    this.y += o.after == null ? 10 : o.after;
  }

  /* cols: [{w, al}] ; head: [[cells]] rows of header ; rows: [[cell]] cell = string | {t,bg,col,b,al,span} */
  table(head, rows, colsW, o = {}) {
    const x0 = this.M, W = this.W - 2 * this.M, sz = o.sz || 18, pad = 10, lh = sz * 1.3;
    const tw = colsW.reduce((a, b) => a + b, 0); const ws = colsW.map(w => w / tw * W);
